
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Включаем Gzip сжатие (ускоряет загрузку)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # 2. Заголовки безопасности (требование задачи)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 3. Проксирование API на бэкенд (BFF)
    # Имя 'bff' мы зададим в docker-compose, порт 5000 мы узнали из кода
    location /api/ {
        proxy_pass http://bff:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. SPA fallback (чтобы при обновлении страницы не было 404)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 5. Healthcheck (проверка жизни контейнера)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}